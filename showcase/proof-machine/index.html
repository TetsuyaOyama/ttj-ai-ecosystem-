<style>
/* One committed dark world: a night blackboard. A full-window particle field

:root{
  --ink:#0a0d13;        /* board */

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font:400 16px/1.75 var(--body);-webkit-text-size-adjust:100%}

#deck{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;

.bar{flex:1;display:flex;gap:4px}

:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.slide{padding:0 20px 26px;max-width:40rem;max-height:66%;overflow-y:auto;animation:rise .5s ease both}
.slide[hidden]{display:none}
@keyframes rise{from{opacity:.01;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font:500 13px/1.4 var(--body);color:var(--dim);letter-spacing:.06em;font-variant-numeric:tabular-nums}

h1,h2{font-family:var(--display);font-weight:700;margin:.35em 0 .2em;line-height:1.25;text-wrap:balance}
h1{font-size:clamp(2.5rem,11vw,4.6rem);letter-spacing:.04em}
h2{font-size:clamp(1.7rem,7vw,2.6rem)}
.sub{font:500 clamp(1.05rem,4.4vw,1.4rem)/1.5 var(--display);color:var(--accent);margin:0 0 .7em}
.big{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 10px;margin:.1em 0 .45em;color:var(--accent)}
.big b{font:700 clamp(3.2rem,16vw,5.6rem)/1 var(--display);font-variant-numeric:tabular-nums}
.big span{font:500 1.05rem/1.4 var(--body);color:var(--paper)}
p{margin:0 0 .6em;max-width:34em}
ul{margin:0;padding:0;list-style:none;display:grid;gap:.55em;max-width:34em}
li{padding-left:1em;border-left:2px solid var(--line);font-size:.97rem;line-height:1.7}
li strong{color:var(--accent);font-weight:700}
.hint{margin-top:1em;font-size:.85rem;color:var(--dim)}
.src{display:grid;gap:.35em;font-size:.86rem;line-height:1.55}
.src li{border-left-color:transparent;padding-left:0}
a{color:var(--chalk);text-underline-offset:3px}
.note{font-size:.84rem;color:var(--dim)}
#index{position:fixed;inset:0;background:rgba(10,13,19,.96);padding:64px 20px 24px;overflow-y:auto}
#index[hidden]{display:none}
#index ol{margin:0 auto;padding:0;list-style:none;max-width:36rem;display:grid;gap:8px}
#index li{border:0;padding:0}
#index li button{width:100%;text-align:left;border-radius:10px;padding:13px 14px;font-size:15px;line-height:1.4;display:flex;gap:14px}

#close{position:fixed;top:14px;right:16px}

@media (prefers-reduced-motion:reduce){.slide{animation:none}}

/* ---------- DOM ---------- */

const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};

/* ---------- shapes: each returns N points in a unit-radius space ---------- */
const R=Math.random,PI=Math.PI,TAU=PI*2;
const onSphere=(r)=>{const u=R()*2-1,t=R()*TAU,s=Math.sqrt(1-u*u);return[r*s*Math.cos(t),r*u,r*s*Math.sin(t)]};
const seg=(a,b)=>{const t=R();return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,(R()-.5)*.03]};
const ZEROS=[14.135,21.022,25.011,30.425,32.935,37.586,40.919,43.327,48.005,49.774]; // first zeros of zeta on the critical line
const ICO=(()=>{const g=(1+Math.sqrt(5))/2,v=[];for(const a of[-1,1])for(const b of[-g,g]){v.push([0,a,b],[a,b,0],[b,0,a])}
  return v.map(p=>{const l=Math.hypot(...p);return p.map(x=>x/l)})})();
const FCC=(()=>{const a=.42,o=[];for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++)for(let k=-3;k<=3;k++){
  if((i+j+k)&1)continue;const p=[i*a/2,j*a/2,k*a/2];if(Math.hypot(...p)<.82)o.push(p)}return o})();
const LAT=(()=>{const d=.27,o=[];for(let i=-5;i<=5;i++)for(let j=-5;j<=5;j++){const x=(i+j/2)*d,y=j*d*.866;if(Math.hypot(x,y)<.98)o.push([x,y])}return o})();
const PRIMES=(()=>{const p=[];for(let n=2;n<=200;n++){let ok=true;for(let d=2;d*d<=n;d++)if(n%d===0){ok=false;break}if(ok)p.push(n)}return p})();
const LI=(()=>{const a=new Float32Array(202);let s=0;for(let x=2;x<=201;x++){a[x]=1.045+s;s+=(1/Math.log(x)+1/Math.log(x+1))/2}return a})(); // logarithmic integral
const SHAPES={
  stair:()=>{const X=x=>(x-2)/198*2-1,Y=c=>c/46*1.6-.8,r=R(),z=(R()-.5)*.03;
    if(r<.14){const k=(R()*PRIMES.length)|0;return[X(PRIMES[k]),Y(k+R()),z]}
    const x=2+R()*198,f=Math.floor(x),li=LI[f]+(LI[f+1]-LI[f])*(x-f);
    if(r<.55){let c=0;while(c<PRIMES.length&&PRIMES[c]<=x)c++;return[X(x),Y(c),z]}
    if(r<.8)return[X(x),Y(li),z];
    return[X(x),Y(li+(R()<.5?1:-1)*Math.sqrt(x)*Math.log(x)/(8*PI)),z]},
  bridge:()=>{const r=R(),z=R()<.5?-.2:.2,arch=x=>-.62+.72*(1-(x/.96)*(x/.96));
    if(r<.28)return[R()*2.2-1.1,.12,z+(R()-.5)*.02];
    if(r<.52){const x=R()*1.92-.96;return[x,arch(x),z]}
    if(r<.78){const x=(((R()*11)|0)-5)*.19,a=arch(x);return[x,a+R()*(.12-a),z]}
    const x=R()*2.4-1.2,w=R()*1.2-.6;return[x,-.74+.02*Math.sin(x*9+w*7),w]},
  cloud:()=>onSphere(Math.cbrt(R())*1.05),
  tri:()=>{const A=[-.92,-.62],B=[.92,-.62],Cc=[.28,.86],r=R();
    if(r<.42){const e=[[A,B],[B,Cc],[Cc,A]][(R()*3)|0];return seg(e[0],e[1])}
    if(r<.80){ // circumcircle
      const d=2*(A[0]*(B[1]-Cc[1])+B[0]*(Cc[1]-A[1])+Cc[0]*(A[1]-B[1])),q=p=>p[0]*p[0]+p[1]*p[1];
      const ox=(q(A)*(B[1]-Cc[1])+q(B)*(Cc[1]-A[1])+q(Cc)*(A[1]-B[1]))/d,oy=(q(A)*(Cc[0]-B[0])+q(B)*(A[0]-Cc[0])+q(Cc)*(B[0]-A[0]))/d;
      const rad=Math.hypot(A[0]-ox,A[1]-oy),t=R()*TAU;return[ox+rad*Math.cos(t),oy+rad*Math.sin(t),(R()-.5)*.03]}
    const m=[[A,[(B[0]+Cc[0])/2,(B[1]+Cc[1])/2]],[B,[(A[0]+Cc[0])/2,(A[1]+Cc[1])/2]],[Cc,[(A[0]+B[0])/2,(A[1]+B[1])/2]]][(R()*3)|0];
    return seg(m[0],m[1])},
  gold:()=>{const r=R();if(r<.2){const t=R()*TAU;return[Math.cos(t),Math.sin(t),(R()-.5)*.05]}
    const k=(R()*6)|0,a=k/6*TAU+PI/2,cx=.6*Math.cos(a),cy=.6*Math.sin(a);
    if(k===5){const t=R()*TAU;return[cx+.2*Math.cos(t),cy+.2*Math.sin(t),0]}   // problem 6: left open
    const p=onSphere(.2*Math.cbrt(R()));return[cx+p[0],cy+p[1],p[2]]},
  matrix:()=>{const i=(R()*4)|0,j=(R()*4)|0,l=(R()*3)|0,s=.17,e=(R()*4)|0,t=(R()*2-1)*s;
    const x=(i-1.5)*.46,y=(j-1.5)*.46;const o=e===0?[t,s]:e===1?[t,-s]:e===2?[s,t]:[-s,t];
    return[x+o[0],y+o[1],(l-1)*.5]},
  unit:()=>{const p=LAT[(R()*LAT.length)|0];if(R()<.3){const q=onSphere(.035);return[p[0]+q[0],p[1]+q[1],q[2]]}
    const a=((R()*6)|0)/6*TAU,t=R()*.27;return[p[0]+Math.cos(a)*t,p[1]+Math.sin(a)*t,(R()-.5)*.02]},
  full:()=>{const i=(R()*6)|0,j=(R()*7)|0,p=onSphere(.085*Math.cbrt(R()));
    return[(i-2.5)*.3+p[0],(j-3)*.27+p[1],p[2]]},
  pack:()=>{const c=FCC[(R()*FCC.length)|0],p=onSphere(.148);return[c[0]+p[0],c[1]+p[1],c[2]+p[2]]},
  vortex:()=>{const t=Math.pow(R(),.8),y=.95-1.9*t,rad=.98*Math.pow(1-t,2.2)+.012,a=t*13*PI+((R()*3)|0)/3*TAU+(R()-.5)*.25;
    return[rad*Math.cos(a),y,rad*Math.sin(a)]},
  zeta:()=>{const T0=10,T1=52,Y=t=>(t-T0)/(T1-T0)*2-1,r=R();
    if(r<.2){const z=ZEROS[(R()*ZEROS.length)|0],p=onSphere(.05*Math.cbrt(R()));return[p[0],Y(z)+p[1],p[2]]}
    if(r<.42)return[(R()-.5)*.012,R()*2-1,(R()-.5)*.012];
    const t=T0+R()*(T1-T0);let lo=T0,hi=ZEROS[0];for(let k=0;k<ZEROS.length;k++){if(t>=ZEROS[k]){lo=ZEROS[k];hi=ZEROS[k+1]||T1}}
    const rad=.5*Math.abs(Math.sin(PI*(t-lo)/(hi-lo)))*(lo===T0?(t-T0)/(hi-T0):1),a=t*1.9;
    return[rad*Math.cos(a),Y(t),rad*Math.sin(a)]},
  knot:()=>{const t=R()*TAU,r=.62+.26*Math.cos(3*t),p=onSphere(.05);
    return[r*Math.cos(2*t)+p[0],r*Math.sin(2*t)+p[1],.3*Math.sin(3*t)+p[2]]},
  plane:()=>{const x=R()*2.4-1.2,z=R()*2.4-1.2,g=R()<.5;const gx=g?Math.round(x/.2)*.2:x,gz=g?z:Math.round(z/.2)*.2;
    return[gx,-.2+.08*Math.sin(gx*3)*Math.cos(gz*3),gz]}
};

/* ---------- engine ---------- */
const cv=document.getElementById("stage"),g=cv.getContext("2d");
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
let W=0,H=0,D=1,N=0,P,V,T,K,cur=-1,rgb=[236,232,223],rgbT=rgb,spin=0,yaw=0,dim=1,dimT=1;
const FLAT=new Set(["tri","gold","unit","full","stair"]); // drawn in a plane: face the viewer and sway instead of spinning
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function size(){
  D=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;
  const n=Math.max(2200,Math.min(5600,Math.round(W*H/190)));
  if(n!==N){N=n;P=new Float32Array(N*3);V=new Float32Array(N*3);T=new Float32Array(N*3);K=new Float32Array(N);
    for(let i=0;i<N;i++){const p=onSphere(1.6*Math.cbrt(R()));P.set(p,i*3);K[i]=.5+R()}
    if(cur>=0)aim(S[cur].shape,true)}
}
function aim(name,snap){const f=SHAPES[name];for(let i=0;i<N;i++){const p=f();T[i*3]=p[0];T[i*3+1]=p[1];T[i*3+2]=p[2]}
  if(snap||still)P.set(T)}
function frame(){
  g.setTransform(D,0,0,D,0,0);g.globalCompositeOperation="source-over";g.globalAlpha=1;g.fillStyle="#0a0d13";g.fillRect(0,0,W,H);
  const wide=W>=860,cx=wide?W*.69:W*.5,cy=wide?H*.5:H*.29,sc=Math.min(wide?W*.27:W*.42,wide?H*.4:H*.25);
  if(!still){spin+=.0032;
    if(FLAT.has(S[cur].shape))yaw+=(Math.round(yaw/TAU)*TAU+.42*Math.sin(spin*1.5)-yaw)*.05;else yaw+=.0032}
  const ca=Math.cos(yaw),sa=Math.sin(yaw),tilt=.32+.08*Math.sin(spin*.7),ct=Math.cos(tilt),st=Math.sin(tilt);
  for(let c=0;c<3;c++)rgb[c]+=(rgbT[c]-rgb[c])*.06;dim+=(dimT-dim)*.06;
  g.globalCompositeOperation="lighter";g.fillStyle=`rgb(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0})`;
  for(let i=0;i<N;i++){const j=i*3;
    if(!still){for(let c=0;c<3;c++){V[j+c]=V[j+c]*.86+(T[j+c]-P[j+c])*.011*K[i];P[j+c]+=V[j+c]}}
    const x=P[j]*ca+P[j+2]*sa,z0=P[j+2]*ca-P[j]*sa,y=P[j+1]*ct-z0*st,z=P[j+1]*st+z0*ct,f=2.6/(2.6+z);
    const s=(i%9===0?2.3:1.35)*f;
    g.globalAlpha=Math.max(.08,Math.min(.95,(.62-z*.34)*dim));
    g.fillRect(cx+x*sc*f-s/2,cy-y*sc*f-s/2,s,s);
  }
  requestAnimationFrame(frame);
}
function go(i){
  i=Math.max(0,Math.min(S.length-1,i));if(i===cur)return;
  if(cur>=0)slides[cur].hidden=true;cur=i;const s=S[i];slides[i].hidden=false;slides[i].scrollTop=0;
  rgbT=hex(s.color);dimT=s.src?.45:1;aim(s.shape);
  deck.style.setProperty("--accent",s.color);
  [...bar.children].forEach((b,k)=>b.classList.toggle("on",k<=i));
  count.textContent=String(i+1).padStart(2,"0")+" / "+String(S.length).padStart(2,"0");
  [...list.querySelectorAll("button")].forEach((b,k)=>b.setAttribute("aria-current",k===i));
}

/* ---------- controls: tap, swipe, keys ---------- */
let swiped=false,tx=0,ty=0;
deck.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;swiped=false},{passive:true});
deck.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){swiped=true;go(cur+(dx<0?1:-1))}
  else if(Math.abs(dy)>12)swiped=true},{passive:true});
deck.addEventListener("click",e=>{if(swiped){swiped=false;return}
  if(e.target.closest("a,button"))return;if(String(getSelection()))return;
  go(cur+(e.clientX<innerWidth*.3?-1:1))});
document.getElementById("open").addEventListener("click",()=>{index.hidden=false;document.getElementById("close").focus()});
document.getElementById("close").addEventListener("click",()=>{index.hidden=true});
addEventListener("keydown",e=>{
  if(e.key==="Escape"){index.hidden=true;return}
  if(!index.hidden)return;
  if(["ArrowRight","ArrowDown","PageDown"," ","Enter"].includes(e.key)){if(e.target.closest&&e.target.closest("a,button"))return;e.preventDefault();go(cur+1)}
  else if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(e.key==="Home")go(0);else if(e.key==="End")go(S.length-1);
});
addEventListener("resize",size);
size();go(0);P.set(T);requestAnimationFrame(frame);
</script>
<script defer src="../analytics.js"></script>
